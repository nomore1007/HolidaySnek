[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "holidaysnek"
version = "0.1.0"
description = "Animated holiday scenes for modern Linux terminals"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = []

[project.scripts]
holidaysnek = "holidaysnek.app:main"

[tool.setuptools]
packages = ["holidaysnek"]
